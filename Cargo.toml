[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
rconn-core = { path = "crates/rconn-core" }
rconn-media = { path = "crates/rconn-media" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
figment = { version = "0.10", features = ["toml"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
opus = "0.4"
opusic-sys = "0.7"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# webrtc 0.21.1 with a relay-driver fix; see vendor/README.md.
[patch.crates-io]
webrtc = { path = "vendor/webrtc" }
