[package]
name = "rconn-media"
description = "Capture abstraction, H.264 (Cisco openh264) and Opus for rconn."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Types only. Loading Cisco's downloaded binary (libloading) is added per target below:
# not on iOS, where the App Store forbids downloaded code and VideoToolbox decodes.
openh264 = { version = "0.9", default-features = false }
opus.workspace = true
thiserror.workspace = true

# Windows ARM64: libopus 1.6.1's NEON code fails under clang-cl (MSVC-only `__emit` in
# runtime CPU detection; missing declarations when NEON is presumed). Scalar build until
# upstream fixes it. Found in the phase 1 cross-compile spike.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
opusic-sys = { workspace = true, features = ["no-simd"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
openh264.workspace = true

[target."cfg(windows)".dependencies]
tracing.workspace = true
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSObject"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCStream", "SCShareableContent", "SCError", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBase", "CMAttachment", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFNumber"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayStream"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
tracing.workspace = true
libc = "0.2"
x11rb = { version = "0.13", features = ["shm", "damage", "xfixes", "randr"] }
# Wayland: xdg-desktop-portal (ScreenCast + RemoteDesktop) and PipeWire frames.
ashpd = { version = "0.14.3", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
pipewire = "0.10.1"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }

[lints]
workspace = true

[dev-dependencies]
anyhow.workspace = true
openh264 = { workspace = true, default-features = false, features = ["libloading"] }
