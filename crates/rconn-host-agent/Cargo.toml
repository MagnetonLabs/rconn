[package]
name = "rconn-host-agent"
description = "rconn host-agent."
license = "LicenseRef-Proprietary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rconn-core = { version = "0.1.0", path = "../rconn-core" }
rconn-media.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rconn-peer = { version = "0.1.0", path = "../rconn-peer" }
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
webrtc = "=0.21.1"
bytes = "1.12.2"
uuid.workspace = true
cpal = "0.18.2"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
