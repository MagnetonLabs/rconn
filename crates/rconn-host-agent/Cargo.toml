[package]
name = "rconn-host-agent"
description = "rconn host-agent."
license = "LicenseRef-Proprietary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rconn-core = { version = "0.1.0", path = "../rconn-core" }
rconn-media.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rconn-peer = { version = "0.1.0", path = "../rconn-peer" }
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
webrtc = "=0.21.1"
bytes = "1.12.2"
uuid.workspace = true
serde_json.workspace = true
cpal = "0.18.2"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_Power"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[dev-dependencies]
tempfile.workspace = true
