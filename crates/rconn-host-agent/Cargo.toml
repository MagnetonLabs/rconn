[package]
name = "rconn-host-agent"
description = "rconn host-agent."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rconn-core = { version = "0.1.0", path = "../rconn-core" }
rconn-media.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rconn-peer = { version = "0.1.0", path = "../rconn-peer" }
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
webrtc = "=0.21.1"
bytes = "1.12.2"
uuid.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

# File transfer: free space on the disk uploads go to.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "time"] }

# Windows/macOS sound capture; Linux records the output through PipeWire instead.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "randr"] }
# Fitting the screen to the viewer on GNOME (Mutter's DisplayConfig); the zbus ashpd uses.
zbus = { version = "6.5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }

[dev-dependencies]
tempfile.workspace = true
# Paused clock for the resize-coalescing tests.
tokio = { version = "1.54.1", features = ["full", "test-util"] }
