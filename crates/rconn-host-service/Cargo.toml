[package]
name = "rconn-host-service"
description = "rconn host-service."
license = "LicenseRef-Proprietary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rconn-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.10", features = ["derive"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
windows-service = "0.8.1"
