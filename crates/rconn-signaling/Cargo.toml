[package]
name = "rconn-signaling"
description = "Open-source signaling server for rconn (hosted and self-hosted modes)."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rconn-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
rand = "0.10.4"
thiserror.workspace = true
async-trait = "0.1.92"
sha2 = "0.11.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
figment = { workspace = true, features = ["toml", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
turn = "0.17"
util = { version = "0.17", package = "webrtc-util" }
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
argon2 = "0.6.0"
hmac = "0.13"
base64 = "0.23.1"

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
tempfile.workspace = true
tokio-tungstenite = "0.30.0"
