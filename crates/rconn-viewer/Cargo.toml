[package]
name = "rconn-viewer"
description = "rconn viewer."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rconn-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rconn-peer = { version = "0.1.0", path = "../rconn-peer" }
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
webrtc = "=0.21.1"
bytes = "1.12.2"
uuid.workspace = true
directories = "6.0.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rconn-media = { version = "0.1.0", path = "../rconn-media", features = ["playback"] }
png = "0.18.1"
rtc = "=0.21.1"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard"] }
bytemuck = "1.25"
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
openidconnect = "4"
arboard = { version = "3.7", default-features = false }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
