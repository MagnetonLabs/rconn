# xcodegen spec for the iOS viewer. Generate the project with:
#   ios/build-rust.sh && (cd ios && xcodegen)
name: Rconn
options:
  bundleIdPrefix: app.rconn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7727LYTG96
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Rconn:
    type: application
    platform: iOS
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION: the workspace version, written by
    # build-rust.sh from Cargo.toml.
    configFiles:
      Debug: Generated/Version.xcconfig
      Release: Generated/Version.xcconfig
    sources:
      - path: Rconn
      - path: Generated/Swift
        group: Rust
    dependencies:
      - framework: Generated/RconnMobileFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      # Sound (cpal on RemoteIO, AVAudioSession).
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
    preBuildScripts:
      - name: Check Rust library
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -d "$PROJECT_DIR/Generated/RconnMobileFFI.xcframework" ]; then
            echo "error: run ios/build-rust.sh first (builds the Rust library and its Swift bindings)"
            exit 1
          fi
    info:
      path: Rconn/Info.plist
      properties:
        CFBundleDisplayName: Rconn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Downloads land in Documents: show it in the Files app ("On My iPhone > Rconn").
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # WebRTC connects straight to the computer when it is on the same network.
        NSLocalNetworkUsageDescription: Rconn connects directly to your computers when they are on the same network.
        # The share sheet after a download offers "Save Image" for pictures.
        NSPhotoLibraryAddUsageDescription: Rconn saves pictures you download from your computer to Photos when you choose Save Image.
        # The sessions' DTLS/SRTP (WebRTC) and TLS (rustls) are standard algorithms, but
        # implemented in the app rather than taken from iOS: App Store Connect's export
        # compliance questions apply (no proprietary encryption; a French declaration only
        # for distribution in France).
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rconn.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Drives the app in the simulator against the test_host example (keys, sound, files) and
  # saves screenshots. Not part of the app.
  RconnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RconnUITests
    dependencies:
      - target: Rconn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rconn.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Rconn:
    build:
      targets:
        Rconn: all
        RconnUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RconnUITests
    archive:
      config: Release
