# Local test IdP for OIDC: docker run -d --name rconn-dex -p 5556:5556 \
#   -v "$PWD/scripts/dev-dex.yaml:/etc/dex/config.yaml:ro" ghcr.io/dexidp/dex dex serve /etc/dex/config.yaml
# Test user: ops@example.com / password. Then: RCONN_TEST_DEX=http://127.0.0.1:5556/dex cargo nextest run

issuer: http://127.0.0.1:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  passwordConnector: local
  skipApprovalScreen: true
enablePasswordDB: true
staticPasswords:
  - email: "ops@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "ops"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
staticClients:
  - id: rconn-viewer
    name: rconn
    public: true
    redirectURIs: ["http://127.0.0.1:8765/callback"]
  - id: other-app
    name: other
    secret: other-secret
    redirectURIs: ["http://127.0.0.1:9999/cb"]
