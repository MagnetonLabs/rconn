# License + advisory gate. The client is closed source: no GPL/AGPL/LGPL anywhere in the
# dependency graph. Add a license here only after checking it permits closed distribution.
[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # Boost: permissive; attribution only required for source distributions.
  "BSL-1.0",
]
confidence-threshold = 0.9


# egui's bundled UI fonts. Fonts may be embedded in software under OFL/Ubuntu Font terms;
# ship their license texts with the viewer (packaging, phase 9). Scoped to this crate only.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# MPL-2.0 is file-level copyleft: fine unmodified in a closed app. Scoped so any new MPL
# dependency gets reviewed. (via directories -> dirs-sys)
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# uniffi (rconn-mobile's Swift bindings), MPL-2.0 like option-ext above: used unmodified.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

# Our own crates are publish = false, so their LicenseRef-Proprietary is skipped.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
  # Marvin: timing side channel in RSA *private-key* operations (decrypt/sign). We only
  # verify IdP-signed OIDC ID tokens with RSA *public* keys and hold no RSA private key,
  # so it isn't reachable. Pulled in by openidconnect 4.1 (pins rsa ^0.9; fix is rsa 0.10).
  # Revisit when openidconnect moves to rsa 0.10.
  { id = "RUSTSEC-2023-0071", reason = "RSA public-key verification only; no private-key operations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
